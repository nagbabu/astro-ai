<!DOCTYPE html>
<html>
<head>
<title>Astro AI</title>
<style>
body {font-family: Arial; background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh;}
.container {background:#1e293b; padding:30px; border-radius:12px; width:350px;}
input,button{width:100%; padding:10px; margin:5px 0;}
button{background:#6366f1; color:white;}
.result{margin-top:10px;}
</style>
</head>
<body>
<div class="container">
<h2>Astro AI</h2>
<form id="f">
<input id="year" placeholder="year">
<input id="month" placeholder="month">
<input id="day" placeholder="day">
<input id="hour" placeholder="hour">
<input id="lat" placeholder="lat">
<input id="lon" placeholder="lon">
<button>Predict</button>
</form>
<div class="result" id="r"></div>
</div>

<script>
document.getElementById("f").onsubmit=async(e)=>{
e.preventDefault();
let y=year.value,m=month.value,d=day.value,h=hour.value,la=lat.value,lo=lon.value;
let res=await fetch(`https://910a6ed4-b866-48c7-a8b7-1c5373af7613-00-jx7xvxkcskwd.sisko.replit.dev/predict?year=${y}&month=${m}&day=${d}&hour=${h}&lat=${la}&lon=${lo}`);
let data=await res.json();
r.innerText=JSON.stringify(data,null,2);
}
</script>
</body>
</html>
